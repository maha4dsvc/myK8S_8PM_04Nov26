apiVersion: apps/v1
kind: Deployment
metadata:
  name: myjavaapp-deploy
  namespace: production
  labels:
    app: myjavaapp
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: myjavaapp
  template:
    metadata:
      labels:
        app: myjavaapp   
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: myjavaapp-container
        image: maha4iac/mahalogin:1 
        ports:
        - containerPort: 8080 
        