apiVersion: apps/v1
kind: Deployment
metadata:
  name: myjavaapp-deploy
  namespace: production
  labels:
    app: myjavaapp
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: myjavaapp
  template:
    metadata:
      labels:
        app: myjavaapp   
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: myjavaapp-container
        image: 138851098059.dkr.ecr.us-east-2.amazonaws.com/myjavaapp:1
        ports:
        - containerPort: 8080